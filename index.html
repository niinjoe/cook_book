<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Recipe Box — Joseph's Kitchen</title>
<meta name="theme-color" content="#F1ECE0">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1ECE0;
    --card:#FBF8F2;
    --ink:#2A2521;
    --ink-soft:#5B5349;
    --rust:#A8632D;
    --rust-deep:#8A4F22;
    --moss:#57603F;
    --line:#DDD3C0;
    --butter:#E8C468;
    --danger:#A3402F;
    --radius:3px;
    --shadow: 0 1px 2px rgba(42,37,33,0.06), 0 4px 14px rgba(42,37,33,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{ background: var(--butter); color:var(--ink); }
  a{color:var(--rust-deep);}

  .app{
    display:grid;
    grid-template-columns: 250px 1fr;
    min-height:100vh;
  }
  @media (max-width: 820px){
    .app{ grid-template-columns: 1fr; }
    .sidebar{ position:static; height:auto; border-right:none; border-bottom:1px solid var(--line); }
  }

  /* ---------- Sidebar : recipe-box divider tabs ---------- */
  .sidebar{
    position:sticky; top:0; height:100vh; overflow-y:auto;
    border-right:1px solid var(--line);
    padding:28px 0 28px 22px;
    display:flex; flex-direction:column;
  }
  .brand{
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:22px;
    letter-spacing:-0.01em;
    padding-right:22px;
    margin-bottom:2px;
  }
  .brand-sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    padding-right:22px;
    margin-bottom:22px;
  }
  .tabs{ display:flex; flex-direction:column; gap:6px; margin-bottom:18px;}
  .tab{
    position:relative;
    display:flex; align-items:center; justify-content:space-between;
    background:var(--card);
    border:1px solid var(--line);
    border-right:none;
    border-radius:var(--radius) 0 0 var(--radius);
    padding:9px 14px 9px 16px;
    margin-right:0;
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    transition: transform .12s ease, background .12s ease;
    color:var(--ink-soft);
  }
  .tab:hover{ transform: translateX(-2px); background:#fff; }
  .tab.active{
    background:var(--card);
    color:var(--ink);
    border-color: var(--rust);
    transform: translateX(-4px);
    box-shadow: var(--shadow);
  }
  .tab.active::after{
    content:"";
    position:absolute; right:-1px; top:0; bottom:0; width:4px;
    background:var(--rust);
  }
  .tab-count{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    background:var(--paper);
    border-radius:10px;
    padding:1px 7px;
  }
  .tab.active .tab-count{ color:var(--rust-deep); }

  .side-actions{ margin-top:auto; padding-right:22px; display:flex; flex-direction:column; gap:8px;}
  .ghost-btn{
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600;
    background:none; border:1px solid var(--line); color:var(--ink-soft);
    border-radius:var(--radius); padding:8px 10px; cursor:pointer; text-align:left;
  }
  .ghost-btn:hover{ border-color:var(--rust); color:var(--rust-deep); }

  /* ---------- Main ---------- */
  .main{ padding:34px 40px 80px; max-width:1080px; }
  @media (max-width:820px){ .main{ padding:24px 18px 60px; } }

  .topline{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:26px;}
  .h1{
    font-family:'Fraunces', serif; font-weight:600; font-size:32px; letter-spacing:-0.01em;
    margin:0 0 4px;
  }
  .h1-sub{ color:var(--ink-soft); font-size:13.5px; margin:0; }
  .add-recipe-btn{
    background:var(--ink); color:var(--paper); border:none; border-radius:var(--radius);
    font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px;
    padding:11px 18px; cursor:pointer; white-space:nowrap;
  }
  .add-recipe-btn:hover{ background:var(--rust-deep); }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap:14px;
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 16px 14px;
    cursor:pointer;
    position:relative;
    box-shadow: var(--shadow);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .card:hover{ transform: translateY(-2px); }
  .card::before{
    content:"";
    position:absolute; top:0; left:16px; width:34px; height:6px;
    background:var(--butter);
    border-radius:0 0 3px 3px;
    opacity:0.9;
  }
  .card-cat{
    font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--moss); margin:10px 0 6px;
  }
  .card-title{
    font-family:'Fraunces', serif; font-weight:600; font-size:17px; line-height:1.25;
    margin:0 0 8px;
  }
  .card-meta{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); }
  .chip-stub{
    display:inline-block; margin-top:9px; font-size:10.5px; font-weight:600;
    color:var(--rust-deep); background:#F3E3D2; border-radius:10px; padding:2px 8px;
  }

  .empty{
    border:1px dashed var(--line); border-radius:var(--radius); padding:40px 20px; text-align:center; color:var(--ink-soft);
  }

  /* ---------- Detail view ---------- */
  .detail{ max-width:720px; }
  .back-btn{
    background:none; border:none; color:var(--ink-soft); font-family:'Inter'; font-size:13px;
    cursor:pointer; padding:0; margin-bottom:18px; display:inline-flex; align-items:center; gap:6px;
  }
  .back-btn:hover{ color:var(--rust-deep); }
  .detail-card{
    background:var(--card); border:1px solid var(--line); border-radius:6px;
    padding:30px 32px; box-shadow:var(--shadow); position:relative;
  }
  .detail-card::before{
    content:""; position:absolute; top:0; left:32px; width:44px; height:8px;
    background:var(--butter); border-radius:0 0 4px 4px;
  }
  .detail-cat{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--moss); margin:12px 0 6px;}
  .detail-title{ font-family:'Fraunces',serif; font-weight:700; font-size:28px; margin:0 0 10px; letter-spacing:-0.01em;}
  .detail-notes{ color:var(--ink-soft); font-size:14.5px; line-height:1.55; margin-bottom:18px; }
  .detail-row-actions{ display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap;}

  .yield-box{
    display:flex; align-items:center; gap:12px; background:var(--paper); border:1px solid var(--line);
    border-radius:var(--radius); padding:10px 14px; margin-bottom:22px; width:fit-content;
  }
  .yield-box .lbl{ font-size:12.5px; color:var(--ink-soft); font-weight:600; }
  .stepper{ display:flex; align-items:center; gap:10px; }
  .stepper button{
    width:26px; height:26px; border-radius:50%; border:1px solid var(--line); background:#fff;
    font-size:15px; cursor:pointer; color:var(--rust-deep); font-weight:700; line-height:1;
  }
  .stepper button:hover{ border-color:var(--rust); }
  .stepper span{ font-family:'IBM Plex Mono',monospace; font-weight:600; min-width:70px; text-align:center; }

  h3.section-h{
    font-family:'Fraunces',serif; font-weight:600; font-size:16px; margin:26px 0 10px;
    border-bottom:1px solid var(--line); padding-bottom:6px;
  }
  .ingredient-list{ list-style:none; padding:0; margin:0; }
  .ingredient-list li{
    display:flex; justify-content:space-between; gap:14px; padding:7px 0;
    border-bottom:1px dotted var(--line); font-size:14px;
  }
  .ingredient-list li:last-child{ border-bottom:none; }
  .ing-amt{ font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--rust-deep); white-space:nowrap; }
  .ing-note{ display:block; font-size:11.5px; color:var(--ink-soft); font-weight:400; }
  .sub-h{ font-weight:700; font-size:12.5px; letter-spacing:0.03em; text-transform:uppercase; color:var(--moss); margin:14px 0 4px;}

  .steps-list{ margin:0; padding-left:22px; }
  .steps-list li{ padding:5px 0; font-size:14.5px; line-height:1.6; }

  .icon-btn{
    background:none; border:1px solid var(--line); color:var(--ink-soft); border-radius:var(--radius);
    font-family:'Inter'; font-size:12.5px; font-weight:600; padding:8px 12px; cursor:pointer;
  }
  .icon-btn:hover{ border-color:var(--rust); color:var(--rust-deep); }
  .icon-btn.danger:hover{ border-color:var(--danger); color:var(--danger); }

  /* ---------- Modal / form ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(42,37,33,0.45); display:flex; align-items:flex-start;
    justify-content:center; padding:40px 16px; overflow-y:auto; z-index:50;
  }
  .modal{
    background:var(--paper); border-radius:6px; width:100%; max-width:640px; padding:28px 28px 30px;
    box-shadow:0 20px 60px rgba(0,0,0,0.25);
  }
  .modal h2{ font-family:'Fraunces',serif; font-size:22px; margin:0 0 18px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.03em;}
  .field input[type=text], .field input[type=number], .field textarea, .field select{
    width:100%; font-family:'Inter'; font-size:14px; padding:9px 10px; border:1px solid var(--line);
    border-radius:var(--radius); background:#fff; color:var(--ink);
  }
  .field textarea{ resize:vertical; min-height:50px; }
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .ing-row, .step-row{ display:flex; gap:8px; margin-bottom:8px; align-items:flex-start; }
  .ing-row input:nth-child(1){ flex:2; }
  .ing-row input:nth-child(2){ flex:1; }
  .ing-row input:nth-child(3){ flex:1.4; }
  .row-remove{ background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:16px; padding:6px; }
  .row-remove:hover{ color:var(--danger); }
  .add-row-btn{
    background:none; border:1px dashed var(--line); border-radius:var(--radius); color:var(--ink-soft);
    font-size:12.5px; font-weight:600; padding:7px 10px; cursor:pointer; width:100%; margin-top:2px;
  }
  .add-row-btn:hover{ border-color:var(--rust); color:var(--rust-deep); }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:22px; }
  .primary-btn{
    background:var(--ink); color:var(--paper); border:none; border-radius:var(--radius);
    font-weight:600; font-size:13.5px; padding:10px 18px; cursor:pointer;
  }
  .primary-btn:hover{ background:var(--rust-deep); }
  .cancel-btn{
    background:none; border:1px solid var(--line); border-radius:var(--radius); color:var(--ink-soft);
    font-weight:600; font-size:13.5px; padding:10px 16px; cursor:pointer;
  }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:20px; font-size:13px;
    box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:100;
  }
  .toast.show{ opacity:1; }

  input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible{
    outline:2px solid var(--rust); outline-offset:1px;
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">The Recipe Box</div>
    <div class="brand-sub">Joseph's Kitchen · gram-precise</div>
    <div class="tabs" id="tabs"></div>
    <div class="side-actions">
      <a class="ghost-btn" href="Josephs-Recipe-Book.pdf" download style="text-decoration:none; display:block;">Download PDF version</a>
      <button class="ghost-btn" id="exportBtn">Export backup (.json)</button>
      <button class="ghost-btn" id="importBtn">Import backup</button>
      <input type="file" id="importFile" accept=".json" style="display:none">
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===================== Data layer (IndexedDB) ===================== */
const DB_NAME = 'recipeBoxDB_v2';
const STORE = 'recipes';
let db;

function openDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (e)=>{
      const _db = e.target.result;
      if(!_db.objectStoreNames.contains(STORE)){
        _db.createObjectStore(STORE, { keyPath:'id' });
      }
    };
    req.onsuccess = (e)=>{ db = e.target.result; resolve(db); };
    req.onerror = (e)=> reject(e);
  });
}
function txStore(mode='readonly'){
  return db.transaction(STORE, mode).objectStore(STORE);
}
function getAll(){
  return new Promise((resolve, reject)=>{
    const req = txStore().getAll();
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = (e)=> reject(e);
  });
}
function putRecipe(recipe){
  return new Promise((resolve, reject)=>{
    const req = txStore('readwrite').put(recipe);
    req.onsuccess = ()=> resolve();
    req.onerror = (e)=> reject(e);
  });
}
function deleteRecipe(id){
  return new Promise((resolve, reject)=>{
    const req = txStore('readwrite').delete(id);
    req.onsuccess = ()=> resolve();
    req.onerror = (e)=> reject(e);
  });
}
function uid(){ return 'r_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }

/* ===================== Seed data ===================== */
/* complete:true  -> fully specified recipe pulled from the recipe book
   complete:false -> placeholder carried over from the book's table of contents;
                     open it and hit Edit to fill in amounts + method            */
const CATEGORY_ORDER = ["Pizza","Breads & Baked Goods","Desserts","Dairy","Breakfast & Snacks","Meal Prep","Condiments & Sauces","Mocktails"];

const SEED = [{"id": "r_dough_ny", "category": "Pizza", "title": "NY-Style Pizza Dough", "subtitle": "5 × 12\" balls", "tags": ["VEGETARIAN", "VEGAN", "FREEZER-FRIENDLY", "MAKE-AHEAD"], "baseYield": 5, "yieldUnit": "dough balls", "notes": "65% hydration with vital wheat gluten for that NY chew. Sized to match the other doughs in this book (1 kg flour, 5 balls). Built for the Ooni Volt 2. Yield: 5 dough balls (~342 g each) · Active: ~30 min · Cold ferment: 24-72 hrs", "ingredients": [{"name": "Bread flour", "amount": 1000, "unit": "g", "note": "", "section": null}, {"name": "Vital wheat gluten", "amount": 10, "unit": "g", "note": "1-2%, up to 20 g for more extensibility", "section": null}, {"name": "Water (total, split below)", "amount": 650, "unit": "g", "note": "", "section": null}, {"name": "Salt", "amount": 22, "unit": "g", "note": "", "section": null}, {"name": "Sugar", "amount": 20, "unit": "g", "note": "", "section": null}, {"name": "Instant dry yeast", "amount": 3, "unit": "g", "note": "reduce to ~1.5 g for 72-hr ferment", "section": null}, {"name": "Olive oil", "amount": 15, "unit": "g", "note": "", "section": null}], "steps": ["Combine flour, vital wheat gluten, sugar, and yeast in a large bowl.", "Add ~90% of the water (≈585 g) and mix until no dry flour remains.", "Dissolve the salt in the remaining ~65 g of water, pour into the dough, and mix by squeezing and folding.", "Add the olive oil and mix until fully absorbed.", "Cover and rest 20 minutes.", "Stretch & fold, Round 1: perform 4 folds (N-S-E-W). Cover and rest 20-30 min.", "Stretch & fold, Round 2: repeat 4 folds. Cover and rest 20-30 min.", "Stretch & fold, Round 3: repeat 4 folds. Rest 20-30 min. Do a 4th round only if the dough still feels slack.", "Transfer to a lightly oiled container. Cold ferment 24-48 hours (up to 72 hrs max — reduce yeast to 0.3% if going 72).", "Divide into 5 balls (~342 g each); tighten each by folding edges underneath.", "Optional freeze: freeze immediately after balling to prevent overfermentation. Wrap individually in plastic, then bag. To use: thaw overnight in fridge, then rest 2-3 hrs at room temp.", "Bake: preheat Ooni Volt 2 stone at least 45 min at 750-800°F. Stretch to 12\" (never roll). Sauce and top sparingly. Bake 4-6 min, rotating halfway. Optional: broil final 30-45 sec for NY-style char."], "tips": "Yeast: 3 g works for 24-48 hr cold ferments; drop to ~1.5 g for 72 hrs to avoid overproofing. Vital wheat gluten: 10 g = moderate chew, up to 20 g = extra-extensible dough. Baker's percentages (vs 1000 g flour): water 65% · salt 2.2% · sugar 2% · oil 1.5% · yeast 0.3%.", "complete": true}, {"id": "r_dough_sd", "category": "Pizza", "title": "NY-Style Sourdough Pizza Dough", "subtitle": "5 × 12\" balls", "tags": ["VEGETARIAN", "VEGAN", "FREEZER-FRIENDLY", "MAKE-AHEAD"], "baseYield": 5, "yieldUnit": "dough balls", "notes": "Same NY-style target as the yeasted dough — thin, chewy, char-flecked — but leavened entirely with an active sourdough starter. Slower rise, more complex tangy flavor. Built for the Ooni Volt 2. Yield: 5 dough balls (~343 g each) · Active: ~30 min · Bulk: 4-6 hrs · Cold ferment: 24-72 hrs", "ingredients": [{"name": "Bread flour", "amount": 900, "unit": "g", "note": "", "section": null}, {"name": "Active sourdough starter (100% hydration, fed & peaked)", "amount": 200, "unit": "g", "note": "", "section": null}, {"name": "Water (additional, beyond starter)", "amount": 550, "unit": "g", "note": "", "section": null}, {"name": "Salt", "amount": 25, "unit": "g", "note": "", "section": null}, {"name": "Olive oil", "amount": 20, "unit": "g", "note": "", "section": null}, {"name": "Sugar", "amount": 10, "unit": "g", "note": "optional, helps browning", "section": null}, {"name": "Vital wheat gluten", "amount": 10, "unit": "g", "note": "optional, for NY chew", "section": null}], "steps": ["Feed your starter 4-8 hrs ahead so it's active and at peak (doubled, domed, floats in water) when you mix.", "Combine bread flour, vital wheat gluten, and sugar in a large bowl.", "Add starter and ~90% of the water (~495 g). Mix until no dry flour remains; rest 20-30 min (autolyse).", "Dissolve salt in the remaining water (~55 g), add to the dough, and mix by squeezing and folding.", "Add the olive oil and mix until fully absorbed.", "Bulk ferment at room temp 4-6 hrs: 4 stretch-and-folds (N-S-E-W) every 30-45 min for the first 2-3 hrs, then leave undisturbed. Expect ~30-50% rise, not a full double.", "Cold ferment 24-72 hrs in a lightly oiled container. Longer (48-72 hrs) = more tang and better browning.", "Divide into 5 balls (~343 g each); tighten by folding the edges underneath.", "Optional freeze: wrap individually and bag right after balling. Thaw overnight in the fridge, then rest 2-3 hrs at room temp before stretching.", "Bake: preheat Ooni Volt 2 stone 45+ min at 750-800°F. Stretch to 12\" (never roll). Sauce and top sparingly. Bake 4-6 min, rotating halfway. Optional: broil final 30-45 sec for NY-style char."], "tips": "Starter activity matters more than time — a sluggish starter needs a longer bulk ferment. If it's less active or the room's cool, extend bulk fermentation rather than rushing the cold ferment. Baker's percentages (vs 1000 g total flour incl. starter's flour): water ~65% · salt 2.5% · oil 2% · sugar 1%. No commercial yeast — an unfed starter gives a flat, dense crust.", "complete": true}, {"id": "r_sauce_ny", "category": "Pizza", "title": "NY-Style Pizza Sauce", "subtitle": "San Marzano, no-cook", "tags": ["VEGETARIAN", "VEGAN", "FREEZER-FRIENDLY", "MAKE-AHEAD"], "baseYield": 794, "yieldUnit": "g sauce (full can)", "notes": "A simple no-cook sauce that lets the San Marzano tomatoes shine — classic for a thin, crisp-crust pie. The oven does the cooking. Sized for a full 794 g Cento can. Yield: sauce for ~4 pizzas · Active: ~5 min + 15-20 min rest", "ingredients": [{"name": "Cento San Marzano peeled tomatoes", "amount": 794, "unit": "g", "note": "full can", "section": null}, {"name": "Garlic cloves, minced or grated", "amount": 2, "unit": "cloves", "note": "", "section": null}, {"name": "Extra virgin olive oil", "amount": 26, "unit": "g", "note": "≈2 tbsp", "section": null}, {"name": "Fine sea salt", "amount": 6, "unit": "g", "note": "≈1 tsp", "section": null}, {"name": "Dried oregano", "amount": 1, "unit": "tsp", "note": "", "section": null}, {"name": "Sugar", "amount": 0.5, "unit": "tsp", "note": "optional, balances acidity", "section": null}, {"name": "Red pepper flakes", "amount": 1, "unit": "pinch", "note": "optional", "section": null}, {"name": "Fresh basil leaves, torn", "amount": 2, "unit": "leaves", "note": "optional", "section": null}], "steps": ["Crush the tomatoes by hand or with a potato masher to your desired texture — slightly chunky is traditional for NY style.", "Stir in garlic, olive oil, salt, oregano, and the optional sugar and pepper flakes. Mix well.", "Rest at room temperature 15-20 minutes so the flavors meld. No cooking needed.", "Tear in fresh basil right before using. Spread a thin layer on the dough — don't overload it."], "tips": "Freezing: this batch uses the whole can, so freeze whatever you don't use right away — seasoned sauce freezes better than plain tomatoes and is ready to use once thawed. Leave basil out of the portion you're freezing; add it fresh after thawing. Freeze flat in a bag with headroom; keeps 3-4 months. Prefer a cooked sauce? Simmer everything 15-20 min instead. Nutrition per full batch: ~180-200 kcal total, mostly from the olive oil.", "complete": true}, {"id": "r_sourdough_bread", "category": "Breads & Baked Goods", "title": "Sourdough Bread", "subtitle": "Bread flour or rye, rustic", "tags": ["VEGETARIAN", "VEGAN", "MAKE-AHEAD"], "baseYield": 2, "yieldUnit": "loaves", "notes": "Your standard two-loaf sourdough, with a rustic/integral variant swapping in rye for some of the flour. Same hydration and salt ratios either way — just a different flour blend and a slightly denser crumb on the rye version. Yield: 2 loaves · Active: ~30 min · Bulk: 4-6 hrs · Cold ferment: 12-24 hrs", "ingredients": [{"name": "Bread flour", "amount": 1000, "unit": "g", "note": "", "section": "Standard (bread flour)"}, {"name": "Water", "amount": 670, "unit": "g", "note": "65-69% hydration, range 650-690 g", "section": "Standard (bread flour)"}, {"name": "Salt", "amount": 21, "unit": "g", "note": "range 20-22 g", "section": "Standard (bread flour)"}, {"name": "Active sourdough starter (100% hydration, fed & peaked)", "amount": 200, "unit": "g", "note": "", "section": "Standard (bread flour)"}, {"name": "Bread flour", "amount": 900, "unit": "g", "note": "", "section": "Rustic/Integral variant"}, {"name": "Rye flour", "amount": 100, "unit": "g", "note": "", "section": "Rustic/Integral variant"}, {"name": "Water", "amount": 670, "unit": "g", "note": "65-69% hydration, range 650-690 g", "section": "Rustic/Integral variant"}, {"name": "Salt", "amount": 21, "unit": "g", "note": "range 20-22 g", "section": "Rustic/Integral variant"}, {"name": "Active sourdough starter (100% hydration, fed & peaked)", "amount": 200, "unit": "g", "note": "", "section": "Rustic/Integral variant"}], "steps": ["Feed your starter 4-8 hrs ahead so it's active and at peak (doubled, domed, floats in water) when mixing.", "Combine flour(s) with ~90% of the water until no dry flour remains. Rest 20-30 min (autolyse) — rye may look wetter/stickier here.", "Dissolve salt in the remaining water, add along with the active starter, and mix by squeezing and folding until incorporated.", "Bulk ferment at room temp 4-6 hrs: 4-6 stretch-and-folds or coil folds at 30-45 min intervals through the first 2-3 hrs, then leave undisturbed. Expect ~30-50% rise.", "Divide into 2 pieces. Pre-shape into loose rounds, rest uncovered 15-20 min, then final-shape into a boule or batard.", "Place seam-side up in a floured banneton. Cold retard in the fridge 12-24 hrs (longer = more sour, better oven spring).", "Preheat oven to 250°C (480°F) with a Dutch oven inside for 45+ min.", "Turn dough onto parchment, score the top, and lower into the Dutch oven. Cover and bake 20 min.", "Remove the lid, drop oven to 230°C (450°F), and bake uncovered 20-25 min more until deep golden-brown (internal ~96-99°C/205-210°F).", "Cool on a wire rack at least 1 hour before slicing — cutting too early gives a gummy crumb."], "tips": "Rye swap: 100 g rye (10%) adds earthy flavor and a denser crumb at the same 65-69% hydration. Push to 150-200 g for more rye flavor, bumping hydration slightly since rye lacks gluten structure. Baker's %: water 65-69% · salt 2-2.2% · starter 20% (vs 1000 g total flour). Same ratios for both variants — only the flour blend changes.", "complete": true}, {"id": "r_shokupan", "category": "Breads & Baked Goods", "title": "Sourdough Shokupan", "subtitle": "Japanese milk bread", "tags": ["VEGETARIAN", "MAKE-AHEAD"], "baseYield": 1, "yieldUnit": "1 lb loaf (~12 slices)", "notes": "A pillowy, cloud-like milk bread with the deep flavor and gentle tang of sourdough, built on a tangzhong starter for extra softness. A genuine two-day project — most of it is inactive fermentation time. Active: ~1.5 hrs · Bulk + cold ferment: overnight · Proof: 6-8 hrs · Bake: 27 min", "ingredients": [{"name": "All-purpose flour (11.7% protein)", "amount": 20, "unit": "g", "note": "", "section": "Tangzhong"}, {"name": "Whole milk", "amount": 100, "unit": "g", "note": "", "section": "Tangzhong"}, {"name": "Whole milk", "amount": 60, "unit": "g", "note": "", "section": "Bread dough"}, {"name": "Granulated sugar", "amount": 30, "unit": "g", "note": "", "section": "Bread dough"}, {"name": "Unsalted butter, sliced into thin pats", "amount": 57, "unit": "g", "note": "", "section": "Bread dough"}, {"name": "All-purpose flour (11.7% protein)", "amount": 260, "unit": "g", "note": "", "section": "Bread dough"}, {"name": "Kosher salt", "amount": 6, "unit": "g", "note": "", "section": "Bread dough"}, {"name": "Egg, large, room temp", "amount": 1, "unit": "egg", "note": "~50 g", "section": "Bread dough"}, {"name": "Sourdough starter (100% hydration)", "amount": 100, "unit": "g", "note": "", "section": "Bread dough"}, {"name": "Neutral oil", "amount": null, "unit": "", "note": "for handling, as needed", "section": "Bread dough"}, {"name": "Egg, large", "amount": 1, "unit": "egg", "note": "", "section": "Egg wash"}, {"name": "Water", "amount": 15, "unit": "g", "note": "1 tbsp", "section": "Egg wash"}], "steps": ["Day 1 morning: feed your starter ~12 hrs before mixing — it should more than double, with bubbles distributed evenly.", "Evening: scald 60 g milk with the sugar, stirring, until simmering and dissolved. Add sliced butter, stir until melted, transfer to the mixer bowl to cool.", "Tangzhong: in the same pan, add the 100 g milk and sprinkle the 20 g flour over it. Cook over medium heat, stirring, until it thickens into a paste. Spread thin on a plate to cool.", "Once the milk/butter mixture cools to 80-90°F, whisk the 260 g flour and salt separately, add to the milk mixture, mix until absorbed (dry and clumpy is fine). Cover, rest 15-20 min.", "Add the cooled tangzhong, egg, and starter. Knead with the dough hook on speed 2 for 20 min — tacky but mostly pulling from the bowl.", "Oil hands and counter. Shape into a ball, return to an oiled bowl, cover, rest 30 min. Do 2-3 stretch-and-folds at 30-min intervals, then refrigerate overnight.", "Day 2: let the cold dough warm up and continue rising in a warm spot ~2 hours, until puffy (likely not doubled yet).", "Divide into 3 portions (~220 g each), roll into balls, rest 10-15 min. Flatten, fold into thirds, flatten again, stretch lengthwise (narrower than the pan), roll into a log, place in the pan.", "Proof in a warm, humid spot 6-8 hrs, until very puffy and risen above the rim — a press should leave a slow-springing indentation.", "Preheat oven to 400°F (205°C) 30+ min. Brush the egg wash generously over the top and exposed sides.", "Bake at 400°F (205°C) 7 min, then 350°F (180°C) for 20 min more, until golden and internal temp reads 190-200°F. Tent with foil if browning too fast.", "Cool in the pan on a rack until just warm, then remove and cool completely before slicing."], "tips": "Use oil rather than extra flour when handling — added flour risks a drier loaf; by day 2 very little handling aid is needed. Rising and proofing times are temperature-dependent — treat them as a guide and rely on visual cues over the clock. This is an enriched dough (milk, butter, egg, sugar, plus a tangzhong paste that lets it hold extra liquid), so it rises taller per gram of flour than a lean dough does. The dome comes from steam and a fat-tenderized gluten network, not from raw flour mass.", "complete": true}, {"id": "r_banana_bread", "category": "Breads & Baked Goods", "title": "Banana Bread", "subtitle": "Cinnamon streusel & toasted pecans", "tags": ["VEGETARIAN", "FREEZER-FRIENDLY"], "baseYield": 1, "yieldUnit": "9×5\" loaf (~10 slices)", "notes": "Moist, warmly spiced banana bread using self-rising flour, topped with a crunchy cinnamon streusel. Salt omitted and baking soda reduced to 2 g because self-rising flour already carries leavening and salt. Oven: 175°C (350°F) · Bake: 60-70 min", "ingredients": [{"name": "Ripe bananas, peeled & mashed", "amount": 340, "unit": "g", "note": "~3 medium bananas", "section": "Batter"}, {"name": "Unsalted butter, melted", "amount": 113, "unit": "g", "note": "", "section": "Batter"}, {"name": "Sugar", "amount": 150, "unit": "g", "note": "", "section": "Batter"}, {"name": "Plain Greek yogurt", "amount": 120, "unit": "g", "note": "", "section": "Batter"}, {"name": "Eggs", "amount": 100, "unit": "g", "note": "~2 large, no shell", "section": "Batter"}, {"name": "Vanilla extract", "amount": 5, "unit": "g", "note": "", "section": "Batter"}, {"name": "Self-rising flour", "amount": 180, "unit": "g", "note": "", "section": "Batter"}, {"name": "Baking soda", "amount": 2, "unit": "g", "note": "reduced", "section": "Batter"}, {"name": "Cinnamon", "amount": 3, "unit": "g", "note": "", "section": "Batter"}, {"name": "Toasted pecans, chopped", "amount": 90, "unit": "g", "note": "80-100 g to taste", "section": "Batter"}, {"name": "Unsalted butter, cold & cubed", "amount": 45, "unit": "g", "note": "", "section": "Streusel"}, {"name": "All-purpose flour", "amount": 60, "unit": "g", "note": "", "section": "Streusel"}, {"name": "Brown sugar", "amount": 50, "unit": "g", "note": "", "section": "Streusel"}, {"name": "Cinnamon", "amount": 3, "unit": "g", "note": "", "section": "Streusel"}], "steps": ["Preheat oven to 175°C (350°F). Grease a 9×5\" loaf pan or line with parchment.", "Streusel: combine flour, brown sugar, and cinnamon. Cut in the cold butter with fingers or a fork until coarse crumbs form. Refrigerate until needed.", "Whisk together mashed bananas, melted butter, sugar, yogurt, eggs, and vanilla until well combined.", "Add self-rising flour, baking soda, and cinnamon. Fold gently with a spatula until just combined — do not overmix. Fold in the pecans.", "Pour batter into the pan and evenly sprinkle the chilled streusel on top.", "Bake 60-70 minutes, until a toothpick comes out clean. If the streusel browns too fast, tent with foil after 40 min.", "Cool in the pan 10 minutes, then move to a wire rack to cool fully before slicing."], "tips": "Self-rising swap: 1:1 by weight for all-purpose (180 g); salt omitted; baking soda cut to 2 g (reacts with the acidic bananas). Streusel keeps AP flour. Fold, don't beat — self-rising flour hates overmixing. No pecans? Swap in 90 g chocolate chips instead — fold in the same way, right at the end.", "complete": true}, {"id": "r_banana_pancakes", "category": "Breads & Baked Goods", "title": "Banana Pancakes", "subtitle": "", "tags": ["VEGETARIAN"], "baseYield": 2, "yieldUnit": "servings", "notes": "Fluffy, naturally sweet pancakes with ripe bananas. The riper the bananas (more brown spots), the better — skip the added sugar entirely if they're very ripe. Active: ~15 min · Nutrition (approx./serving): ~380 kcal · P 12 g · C 62 g · F 9 g · Fiber 3 g", "ingredients": [{"name": "Ripe bananas, peeled", "amount": 210, "unit": "g", "note": "~2 medium, 200-220 g", "section": null}, {"name": "Large eggs", "amount": 2, "unit": "eggs", "note": "", "section": null}, {"name": "All-purpose flour", "amount": 120, "unit": "g", "note": "", "section": null}, {"name": "Milk", "amount": 120, "unit": "ml", "note": "", "section": null}, {"name": "Baking powder", "amount": 1, "unit": "tsp", "note": "", "section": null}, {"name": "Salt", "amount": 0.25, "unit": "tsp", "note": "", "section": null}, {"name": "Vanilla extract", "amount": 1, "unit": "tsp", "note": "", "section": null}, {"name": "Sugar", "amount": 15, "unit": "g", "note": "", "section": null}, {"name": "Butter or neutral oil", "amount": 1, "unit": "tbsp", "note": "for pan", "section": null}], "steps": ["Mash the bananas in a large bowl until mostly smooth — a few small lumps add texture.", "Whisk in the eggs, milk, and vanilla until well combined.", "Add flour, baking powder, salt, and sugar. Stir gently until just combined — do not overmix (overworking develops gluten and toughens them).", "Rest the batter 5 minutes so the baking powder activates — fluffier pancakes.", "Heat a nonstick pan over medium heat and melt the butter. Pour ~60-70 g batter per pancake. Cook until bubbles form and edges set (~2-3 min), flip, and cook 1-2 min more until golden."], "tips": "Extra protein: swap 30 g of the flour for oat flour or add a scoop of vanilla protein powder. Add-ins: chocolate chips, chopped walnuts, or a pinch of cinnamon. Keep finished pancakes warm in a ~90°C oven while cooking the rest.", "complete": true}, {"id": "r_apple_crisp", "category": "Desserts", "title": "Freezer-Friendly Apple Crisp", "subtitle": "Air fryer ready", "tags": ["VEGETARIAN", "FREEZER-FRIENDLY", "MAKE-AHEAD"], "baseYield": 7, "yieldUnit": "small portions (6-8)", "notes": "Individually portioned apple crisps built to go straight from freezer to air fryer — no thawing needed. Good for keeping a single-serving dessert on hand without baking a whole pan. Also works portioned into loaf pans instead of ramekins. Active: ~20 min · Air fryer bake (from frozen): 20-25 min", "ingredients": [{"name": "Apples, peeled, cored, thinly sliced", "amount": 900, "unit": "g", "note": "~6 medium", "section": "Apple filling"}, {"name": "Brown sugar", "amount": 50, "unit": "g", "note": "1/4 cup", "section": "Apple filling"}, {"name": "Lemon juice", "amount": 15, "unit": "g", "note": "1 tbsp", "section": "Apple filling"}, {"name": "Cornstarch", "amount": 10, "unit": "g", "note": "1 tbsp", "section": "Apple filling"}, {"name": "Cinnamon", "amount": 1, "unit": "tsp", "note": "", "section": "Apple filling"}, {"name": "Nutmeg", "amount": 0.5, "unit": "tsp", "note": "", "section": "Apple filling"}, {"name": "Salt", "amount": 1, "unit": "pinch", "note": "", "section": "Apple filling"}, {"name": "Rolled oats", "amount": 90, "unit": "g", "note": "3/4 cup", "section": "Crisp topping"}, {"name": "All-purpose flour", "amount": 75, "unit": "g", "note": "1/2 cup", "section": "Crisp topping"}, {"name": "Brown sugar", "amount": 100, "unit": "g", "note": "1/2 cup", "section": "Crisp topping"}, {"name": "Cinnamon", "amount": 1, "unit": "tsp", "note": "", "section": "Crisp topping"}, {"name": "Unsalted butter, cold & cubed", "amount": 90, "unit": "g", "note": "6 tbsp", "section": "Crisp topping"}, {"name": "Caramel sauce (whisky caramel or plain), warmed", "amount": null, "unit": "", "note": "optional, 1-2 tbsp per portion", "section": "Optional finish"}], "steps": ["Toss the apple slices with lemon juice, brown sugar, cornstarch, cinnamon, nutmeg, and salt until evenly coated.", "Make the topping: mix oats, flour, brown sugar, and cinnamon in a bowl. Cut in the cold butter with a fork or your fingers until crumbly.", "Portion into small freezer-safe ramekins, silicone muffin molds, foil containers, or 1 lb loaf pans — about 1 cup of apple mixture per ramekin-sized portion (a loaf pan holds roughly 2-3 portions' worth).", "Sprinkle the crisp topping generously over each portion.", "Wrap tightly with plastic wrap and foil, or use airtight containers. Label with the date and freeze up to 3 months.", "To bake from frozen: preheat the air fryer to 175°C (350°F). Place one frozen crisp, unwrapped, directly into the basket. (Loaf pans that don't fit the air fryer basket can bake in a regular oven at the same temperature — add 5-10 minutes since they hold more filling.)", "Air fry 20-25 minutes, until the apples are bubbling and the topping is golden. If the topping browns too quickly, cover loosely with foil halfway through.", "Optional: drizzle warm caramel sauce over each portion just before serving."], "tips": "No thawing needed — these go straight from freezer to air fryer, which is the whole point of portioning them individually. Loaf pans work well if you'd rather serve slices than individual ramekins — same fill-and-freeze approach, just adjust bake time up slightly for the larger portion. Cornstarch matters: it keeps the filling thick and jammy instead of watery once the apples release liquid during baking. Apple choice: firmer, tart varieties (Granny Smith, Honeycrisp) hold their shape better than soft ones (Red Delicious), which can turn mushy. Caramel drizzle: the High-End Whisky Caramel Sauce in this book pairs especially well here — warm it gently before drizzling.", "complete": true}, {"id": "r_cheesecake", "category": "Desserts", "title": "High-End Cheesecake", "subtitle": "Restaurant style, water bath", "tags": ["VEGETARIAN", "MAKE-AHEAD"], "baseYield": 1, "yieldUnit": "9\" cheesecake", "notes": "Silky, custardy, restaurant-style cheesecake, scaled for a 9\" springform (about 1.27× an 8\" recipe by area). The technique matters as much as the ratios: mixing slow to avoid air bubbles, baking in a water bath, and cooling gradually are what separate this from a home-style cheesecake. Active: ~1 hr · Bake: 65-75 min · Chill: 12+ hrs overnight", "ingredients": [{"name": "Graham crackers, Biscoff, or Oreos (filling included), crushed", "amount": 200, "unit": "g", "note": "", "section": "Crust"}, {"name": "Butter, melted", "amount": 90, "unit": "g", "note": "or browned for deeper flavor", "section": "Crust"}, {"name": "Sugar", "amount": 25, "unit": "g", "note": "", "section": "Crust"}, {"name": "Salt", "amount": 1, "unit": "g", "note": "", "section": "Crust"}, {"name": "Cream cheese, room temp", "amount": 860, "unit": "g", "note": "", "section": "Filling"}, {"name": "Sour cream", "amount": 215, "unit": "g", "note": "or crème fraîche for richer version", "section": "Filling"}, {"name": "Granulated sugar", "amount": 200, "unit": "g", "note": "", "section": "Filling"}, {"name": "Eggs, whole", "amount": 200, "unit": "g", "note": "~4 large", "section": "Filling"}, {"name": "Cornstarch", "amount": 25, "unit": "g", "note": "", "section": "Filling"}, {"name": "Lemon juice", "amount": 19, "unit": "g", "note": "", "section": "Filling"}, {"name": "Vanilla extract", "amount": 6, "unit": "g", "note": "or scraped vanilla bean", "section": "Filling"}, {"name": "Salt", "amount": 1, "unit": "g", "note": "", "section": "Filling"}, {"name": "Heavy cream", "amount": 75, "unit": "g", "note": "optional, for softer texture", "section": "Filling"}], "steps": ["Line the bottom of a 9\" springform with parchment. Wrap the outside heavily in foil for the water bath.", "Crust: pulse crackers into fine crumbs, mix in sugar and salt, add melted butter. Press firmly into the base only. Bake at 350°F (175°C) for 10 min, then cool completely.", "Beat cream cheese on low until smooth with no lumps — mix slow throughout; incorporating air causes cracks and grainy texture.", "Add sugar (mix on low until integrated), then sour cream, lemon juice, vanilla, and salt. Add cornstarch and mix gently.", "Add eggs one at a time, mixing only until just absorbed. Whisk in heavy cream last, by hand, if using. Filling should be glossy and bubble-free.", "Lower oven to 320°F (160°C). Pour filling into the cooled crust.", "Place the springform in a roasting pan, add hot water halfway up the sides, and bake 65-75 min, until edges are set and the center jiggles like gelatin, not liquid.", "Turn off the oven, crack the door, and leave the cheesecake inside 1 hour.", "Remove, cool on the counter 1 hour, then chill overnight (12 hrs min) — this slow cool-down cures the texture and prevents cracking."], "tips": "Luxury tweaks: browned butter crust; crème fraîche instead of sour cream; scraped vanilla bean instead of extract; Maldon salt on top. No graham crackers or Biscoff? Oreos (crushed whole, filling included) work as a 1:1 swap for the 200 g crumbs — skip the added sugar in the crust since Oreos are already sweet, and expect a darker, more chocolate-forward base. Finishing: crème anglaise + raspberry coulis; torched top with caramel shard; black sesame praline with yuzu; or Basque-style torched top with mascarpone and honey. Storage: rest 20-30 min at room temp before serving; 4-5 days refrigerated; freezes 1-2 months.", "complete": true}, {"id": "r_tres_leches", "category": "Desserts", "title": "Tres Leches Cake", "subtitle": "Bizcocho, crema & merengue", "tags": ["VEGETARIAN", "MAKE-AHEAD"], "baseYield": 12, "yieldUnit": "servings (9×13\" cake)", "notes": "A classic Puerto Rican tres leches: a light sponge soaked in a three-milk custard, finished with a baked meringue topping. Made in three stages — cake, milk soak, then meringue. Active: ~45 min · Bake: 20 min + 5 min", "ingredients": [{"name": "Sugar", "amount": 200, "unit": "g", "note": "1 cup", "section": "Bizcocho (sponge cake)"}, {"name": "Self-rising flour (Presto or similar), sifted", "amount": 120, "unit": "g", "note": "1 cup", "section": "Bizcocho (sponge cake)"}, {"name": "Eggs, separated", "amount": 5, "unit": "eggs", "note": "", "section": "Bizcocho (sponge cake)"}, {"name": "Vanilla extract", "amount": 1, "unit": "tsp", "note": "", "section": "Bizcocho (sponge cake)"}, {"name": "Sweetened condensed milk", "amount": 397, "unit": "g", "note": "1 can, 14 oz", "section": "Crema (tres leches soak)"}, {"name": "Evaporated milk", "amount": 354, "unit": "g", "note": "1 can, 12 oz", "section": "Crema (tres leches soak)"}, {"name": "Regular milk", "amount": 354, "unit": "g", "note": "measured using the empty evaporated milk can", "section": "Crema (tres leches soak)"}, {"name": "Egg yolks", "amount": 3, "unit": "yolks", "note": "", "section": "Crema (tres leches soak)"}, {"name": "Vanilla extract", "amount": 1, "unit": "tsp", "note": "", "section": "Crema (tres leches soak)"}, {"name": "Egg whites", "amount": 3, "unit": "whites", "note": "", "section": "Topping (meringue)"}, {"name": "Sugar", "amount": 200, "unit": "g", "note": "1 cup", "section": "Topping (meringue)"}, {"name": "Vanilla extract", "amount": 1, "unit": "tsp", "note": "", "section": "Topping (meringue)"}], "steps": ["Bizcocho: in a bowl, beat the egg whites until stiff, snowy peaks form.", "Add the sugar to the whipped whites, then fold in the egg yolks, vanilla, and finally the sifted flour, mixing gently to keep the batter airy.", "Pour into a greased 9×13\" aluminum or metal pan. Bake at 350°F for 20 minutes — check at 18 minutes with a toothpick. Don't open the oven early, or the cake can collapse.", "Crema: blend the condensed milk, evaporated milk, regular milk, egg yolks, and vanilla together until smooth.", "Once the baked cake has cooled slightly, poke small holes across the surface and pour the milk mixture evenly over the top, letting it soak in fully.", "Meringue: beat the egg whites to soft peaks, then gradually add the sugar, beating until glossy and stiff. Beat in the vanilla.", "Spread the meringue over the soaked cake and bake again for about 5 minutes, until the top is set and lightly firm."], "tips": "Presto flour is a Puerto Rican self-rising flour brand — substitute 120 g all-purpose flour + 1.5 tsp baking powder + a pinch of salt if needed. Poking holes before pouring the crema lets the cake absorb all three milks instead of sitting on top — more holes, more even soak. Refrigerate after the final bake (the cake is very moist); keeps 3-4 days chilled.", "complete": true}, {"id": "r_teddy_crust", "category": "Desserts", "title": "Teddy Graham Cheesecake Crust", "subtitle": "", "tags": ["VEGETARIAN"], "baseYield": 1, "yieldUnit": "8\" crust", "notes": "A finer, sweeter, honey-cookie alternative to graham cracker crust — softer bite, doesn't shatter under a fork. Pairs especially well with whisky caramel or berry toppings. Active: ~15 min · Pre-bake: 10 min", "ingredients": [{"name": "Teddy Grahams", "amount": 180, "unit": "g", "note": "", "section": null}, {"name": "Unsalted butter, melted", "amount": 75, "unit": "g", "note": "", "section": null}, {"name": "Fine sea salt", "amount": 1, "unit": "g", "note": "", "section": null}, {"name": "Cinnamon", "amount": 0.5, "unit": "tsp", "note": "optional", "section": null}, {"name": "Brown sugar", "amount": 1, "unit": "tbsp", "note": "optional, for extra caramel depth", "section": null}], "steps": ["Pulse the Teddy Grahams in a food processor until they reach a fine, sand-like texture — no big chunks, which create weak spots in the crust.", "Combine the crumbs with salt (and cinnamon, if using). Add the melted butter gradually, mixing until the texture feels like damp beach sand.", "Press firmly into the bottom of the pan only, not up the sides. Use the flat bottom of a glass for even compaction — don't over-compress, or the crust turns hard.", "Bake at 350°F (175°C) for 10 minutes. Cool completely before filling — this locks in structure and prevents sogginess."], "tips": "Teddy Grahams are already sweet — don't over-sweeten the mix. Compared to regular graham crackers: sweeter on their own, needs slightly more butter (~75 g vs ~70 g), and rarely needs added sugar. Browned butter swap: replace 15 g of the butter with browned butter for a nutty depth that pairs beautifully with whisky caramel or bourbon-based fillings. A pinch of flaky salt on the finished crust elevates the sweetness noticeably.", "complete": true}, {"id": "r_whisky_caramel", "category": "Desserts", "title": "High-End Whisky Caramel Sauce", "subtitle": "Cheesecake edition", "tags": ["VEGETARIAN", "MAKE-AHEAD", "CONTAINS ALCOHOL"], "baseYield": 375, "yieldUnit": "g sauce", "notes": "A silky, restaurant-style caramel built the classic way — dry caramel base, then butter, cream, and whisky added in sequence. Designed to accent a cheesecake slice, not dominate it. Active: ~15 min", "ingredients": [{"name": "Granulated sugar", "amount": 200, "unit": "g", "note": "", "section": null}, {"name": "Unsalted butter, room temp, cubed", "amount": 90, "unit": "g", "note": "", "section": null}, {"name": "Heavy cream, warmed", "amount": 160, "unit": "g", "note": "not hot", "section": null}, {"name": "Whisky (bourbon, Irish, or caramel-forward Scotch)", "amount": 40, "unit": "g", "note": "35-45 g range", "section": null}, {"name": "Vanilla extract", "amount": 5, "unit": "g", "note": "1 tsp", "section": null}, {"name": "Fine sea salt", "amount": 2, "unit": "g", "note": "0.5 tsp", "section": null}], "steps": ["Add the sugar to a heavy saucepan over medium heat. Don't stir — gently swirl the pan as it melts. Cook until deep amber, the color of dark honey or copper (not pale, not burnt).", "Remove from heat and add the butter all at once, whisking until fully melted and smooth. It will bubble aggressively — this is normal.", "Slowly pour in the warm cream while whisking continuously. Return to low heat briefly if needed to smooth it out.", "Remove from heat and add the whisky. Return to low heat and simmer 60-90 seconds — this cooks off the harsh alcohol while keeping the aroma.", "Remove from heat and stir in the vanilla and salt. Let cool 5-10 minutes before using."], "tips": "Whisky choice matters: bourbon, Irish whisky, or a Scotch with caramel notes work best — avoid heavily peated Scotch, which will overpower the cheesecake. Serving: let the cheesecake slice sit 20-30 min at room temp, warm the sauce gently (not boiling), and spoon 1.5-2 tbsp per slice — accent, not domination. Variations: bold (45 g whisky + 1/2 tsp espresso powder), smooth & elegant (35 g whisky + 1 tbsp honey), salted (3/4 tsp salt + flaky salt on plate), or whisky orange (add 1/2 tsp orange zest). If too thick, add 1-2 tbsp warm cream; if too thin, simmer 30-60 seconds more. Keeps 2 weeks refrigerated — reheat gently.", "complete": true}, {"id": "r_sauce_ideas", "category": "Desserts", "title": "Best High-End Sauces for Cheesecake", "subtitle": "Idea list", "tags": [], "baseYield": null, "yieldUnit": "", "notes": "Quick-reference ratios for topping a cheesecake, ranked by style. Not full recipes — just the ratio, method in one line, and what it pairs with.", "ingredients": [], "steps": ["Berry Coulis (restaurant classic — never wrong): 250 g berries (raspberry, strawberry, or blueberry) · 60 g sugar · 10 g lemon juice. Simmer, blend, strain. Best with NY cheesecake, vanilla bean cheesecake, Teddy Graham crust, or Oreo crust.", "Passion Fruit or Mango Coulis (bright, modern): 200 g passion fruit pulp or mango purée · 60 g sugar · 5 g lime juice. No heavy cooking — preserve freshness. Best with crème fraîche cheesecake, coconut or vanilla bases.", "Crème Anglaise (French, ultra-refined): 250 g milk or cream · 3 egg yolks · 60 g sugar · vanilla. Cook to nappe (82-84°C). Best with minimalist cheesecake, thin or no-crust styles.", "Salted Honey Cream (understated, modern): 120 g heavy cream · 40 g honey · pinch of salt. Warm and whisk. Best with Teddy Graham crust, ricotta or mascarpone cheesecake.", "Lemon Curd (bold, sharp, dramatic): 120 g lemon juice · 150 g sugar · 3 eggs · 80 g butter. Cook gently, strain. Best with dense cheesecake, shortbread-style crusts.", "White Chocolate Ganache (use sparingly): 200 g white chocolate · 100 g heavy cream. Thin drizzle only. Best with berry garnish, Oreo crust.", "Apple-Vanilla Compote (warm, autumnal): 300 g apples, brunoise · 40 g sugar · vanilla · a splash of lemon. Best with spiced crusts, fall menus."], "tips": "Best match for an Oreo crust specifically: the High-End Whisky Caramel Sauce (recipe in this book) — the caramel and cookie play off each other well, especially with a vanilla bean filling. Berry Coulis and White Chocolate Ganache also pair particularly well with Oreo.", "complete": true}, {"id": "r_cheese_flan", "category": "Desserts", "title": "Cheese Flan", "subtitle": "With whisky-infused caramel", "tags": ["VEGETARIAN", "MAKE-AHEAD", "CONTAINS ALCOHOL"], "baseYield": 1, "yieldUnit": "9\" round", "notes": "A silky, egg-forward custard flan with a true whisky caramel bottom layer (no butter or cream in the caramel itself). Scaled for a 9\" round to match the same springform used for the cheesecake in this book (about 1.27× an 8\" recipe by area). Bake: 60-75 min · Chill: 6+ hrs, overnight best", "ingredients": [{"name": "Granulated sugar", "amount": 250, "unit": "g", "note": "", "section": "Whisky caramel (bottom layer)"}, {"name": "Water", "amount": 50, "unit": "g", "note": "", "section": "Whisky caramel (bottom layer)"}, {"name": "Whisky (bourbon or Irish preferred)", "amount": 44, "unit": "g", "note": "", "section": "Whisky caramel (bottom layer)"}, {"name": "Cream cheese, room temp", "amount": 315, "unit": "g", "note": "", "section": "Custard"}, {"name": "Whole milk", "amount": 630, "unit": "g", "note": "", "section": "Custard"}, {"name": "Eggs, whole", "amount": 250, "unit": "g", "note": "~5 large, no shell", "section": "Custard"}, {"name": "Sweetened condensed milk", "amount": 150, "unit": "g", "note": "", "section": "Custard"}, {"name": "Granulated sugar", "amount": 75, "unit": "g", "note": "", "section": "Custard"}, {"name": "Vanilla extract", "amount": 6, "unit": "g", "note": "", "section": "Custard"}, {"name": "Fine sea salt", "amount": 1, "unit": "g", "note": "", "section": "Custard"}, {"name": "Dark rum or brandy", "amount": 13, "unit": "g", "note": "optional, very subtle", "section": "Custard"}], "steps": ["Caramel: add sugar and water to a saucepan over medium heat. Cook without stirring until deep amber (dark honey or copper — too pale is weak, too dark turns bitter).", "Remove from heat, carefully add the whisky, and swirl gently — it will bubble. Immediately pour into the flan mold and tilt to coat the bottom evenly. Let it harden.", "Custard: beat the cream cheese gently until smooth. Add the condensed milk and sugar, then the eggs one at a time, mixing on low the whole time to avoid incorporating air.", "Add the milk slowly, then the vanilla, salt, and optional rum. Strain through a fine sieve — this step is what makes the texture silky.", "Pour the custard over the hardened caramel and cover loosely with foil.", "Bake in a water bath: place the mold in a roasting pan, add hot water halfway up the sides, and bake at 325°F (160°C) for 60-75 minutes, until the center jiggles like gelatin (not liquid), the edges are set, and the internal temp reads 170-175°F (77-80°C). Don't overbake — it sets more as it cools.", "Cool at room temp 1 hour, then refrigerate at least 6 hours (overnight gives the best texture).", "Unmold: run a knife gently around the edges, warm the bottom briefly (hot towel or a quick pass over a flame), invert onto a plate, and let the caramel flow naturally. Don't force it."], "tips": "Why whisky works here but not in cheesecake: the egg-forward custard absorbs the aroma, and the lighter dairy lets the whisky come through instead of getting buried in fat. Serving ideas: micro-grated orange zest, toasted almonds or pecans, a tiny pinch of flaky salt, or a dusting of espresso powder — serve the flan cold with the caramel at room temp for an intentional contrast. Storage: refrigerated 3-4 days; do not freeze, as the custard breaks.", "complete": true}, {"id": "r_sticky_toffee", "category": "Desserts", "title": "Sticky Toffee Pudding", "subtitle": "Loaf pans + ramekins", "tags": ["VEGETARIAN", "FREEZER-FRIENDLY", "MAKE-AHEAD", "CONTAINS ALCOHOL"], "baseYield": 1, "yieldUnit": "batch (2 loaf pans + 2-3 ramekins)", "notes": "A 2× scaled version sized to fill two standard 1 lb loaf pans plus 2-3 ramekins, instead of an 8×8 pan. Dates soaked in boiling water (not drained) build the moisture and caramel depth of the crumb. Active: ~30 min · Bake: 35-40 min (loaf pans), 18-22 min (ramekins)", "ingredients": [{"name": "Medjool dates, chopped", "amount": 360, "unit": "g", "note": "", "section": "Pudding batter"}, {"name": "Boiling water", "amount": 500, "unit": "g", "note": "", "section": "Pudding batter"}, {"name": "Baking soda", "amount": 10, "unit": "g", "note": "2 tsp", "section": "Pudding batter"}, {"name": "Unsalted butter, softened", "amount": 200, "unit": "g", "note": "", "section": "Pudding batter"}, {"name": "Dark brown sugar", "amount": 280, "unit": "g", "note": "", "section": "Pudding batter"}, {"name": "Eggs, large", "amount": 4, "unit": "eggs", "note": "", "section": "Pudding batter"}, {"name": "All-purpose flour", "amount": 340, "unit": "g", "note": "", "section": "Pudding batter"}, {"name": "Baking powder", "amount": 12, "unit": "g", "note": "3 tsp", "section": "Pudding batter"}, {"name": "Vanilla extract", "amount": 2, "unit": "tsp", "note": "", "section": "Pudding batter"}, {"name": "Salt", "amount": 1, "unit": "tsp", "note": "", "section": "Pudding batter"}, {"name": "Dark brown sugar", "amount": 400, "unit": "g", "note": "", "section": "Toffee sauce"}, {"name": "Heavy cream", "amount": 400, "unit": "g", "note": "", "section": "Toffee sauce"}, {"name": "Unsalted butter", "amount": 200, "unit": "g", "note": "", "section": "Toffee sauce"}, {"name": "Vanilla extract", "amount": 1, "unit": "tsp", "note": "", "section": "Toffee sauce"}, {"name": "Salt", "amount": 1, "unit": "pinch", "note": "", "section": "Toffee sauce"}, {"name": "Bourbon or dark rum", "amount": null, "unit": "", "note": "optional, 2-4 tbsp", "section": "Toffee sauce"}], "steps": ["Chop the dates finely (smaller pieces soften faster). Pour the boiling water directly over them, then immediately add the baking soda — this helps break the dates down for a lighter crumb.", "Let the mixture sit 10 minutes, then mash the dates right in the same bowl, water and all — don't drain anything. It should look thick, gooey, slightly chunky, and syrupy.", "Cream the softened butter and brown sugar until fluffy. Add the eggs one at a time, mixing well after each.", "Whisk the flour, baking powder, and salt together separately. Fold into the butter mixture alternately with the mashed date mixture, along with the vanilla, mixing until just combined.", "Divide the batter: split it between two greased 1 lb loaf pans, filling each about 2/3 full, then divide the remainder between 2-3 ramekins, filled 3/4 full.", "Bake the loaf pans 35-40 minutes and the ramekins 18-22 minutes, both at 350°F (175°C), until set and a toothpick comes out clean.", "Toffee sauce: combine the brown sugar, cream, and butter in a saucepan. Bring to a simmer, whisking, and cook 3-5 minutes until thickened. Stir in the vanilla, salt, and optional bourbon or rum.", "Serve the warm pudding with the toffee sauce poured generously over the top."], "tips": "Why loaf pans: 2/3-filled loaf pans give the same total batter capacity as the original 8×8 pan, but with less overflow risk since each pan has more headroom below the rim. Keep the date-soaking water — it extracts sugars for deeper caramel flavor, keeps the batter moist, and the baking soda needs that liquid to react and lighten the crumb. Texture check after mashing: thick, gooey, slightly chunky, pourable — like a smooth-ish date paste in syrup.", "complete": true}, {"id": "r_labneh", "category": "Dairy", "title": "Greek Yogurt Cream Cheese (Labneh)", "subtitle": "Strained overnight", "tags": ["VEGETARIAN", "HIGH PROTEIN", "MAKE-AHEAD"], "baseYield": 500, "yieldUnit": "g yogurt in (~200-250 g labneh out)", "notes": "A thick, tangy strained-yogurt spread — a legit cream cheese substitute for bagels, toast, or dips, with far more protein than the store-bought stuff. Patience is the main ingredient. Active: 5 min · Strain: 8-24 hrs · Keeps: ~1 week refrigerated", "ingredients": [{"name": "Full-fat Greek yogurt", "amount": 500, "unit": "g", "note": "", "section": null}, {"name": "Salt", "amount": 3, "unit": "g", "note": "0.5 tsp", "section": null}, {"name": "Lime juice, fresh", "amount": 15, "unit": "g", "note": "1 tbsp, lemon works too", "section": null}], "steps": ["Combine the yogurt, salt, and lime juice in a bowl; stir until fully incorporated.", "Line a fine-mesh strainer with 2-3 layers of cheesecloth (or a clean cotton towel) and set it over a bowl deep enough that the strainer never touches the collected whey.", "Pour the mixture in, fold the cloth loosely over the top, and refrigerate.", "Strain at least 8 hours; up to 24 for a firmer, denser, block-cream-cheese texture. Longer = thicker.", "Transfer to an airtight container. Keep the whey — it's great in smoothies or bread dough."], "tips": "Kirkland (Costco) Greek yogurt: works well and is already thick, so ~8 hrs is enough — but it's non-fat, so the result is lighter and tangier. Stir in 1-2 tbsp heavy cream after straining to add richness back. Finishes: honey only · honey + olive oil · honey + walnuts · honey + fresh thyme or za'atar. Protein: most casein stays in the solids. Per 100 g (non-fat base): yogurt ~10 g protein / labneh ~8-9 g — but per tablespoon it's more concentrated than the original yogurt, and carbs drop as lactose leaves with the whey.", "complete": true}, {"id": "r_cottage_cheese", "category": "Dairy", "title": "Cottage Cheese", "subtitle": "Quick-use idea list", "tags": ["HIGH PROTEIN"], "baseYield": null, "yieldUnit": "", "notes": "What to do with a Costco tub. Not a single recipe — a menu of high-protein uses.", "ingredients": [], "steps": ["High-protein snacks & breakfast — Sweet bowl: top with fruit (berries, peach, pineapple) and a drizzle of honey.", "High-protein snacks & breakfast — Savory bowl: everything bagel seasoning, cucumber, cherry tomatoes.", "High-protein snacks & breakfast — Smoothie booster: blend into a protein smoothie; it disappears and adds creaminess.", "Meals — Scrambled eggs: mix in before cooking for extra-fluffy, protein-dense eggs.", "Meals — Pasta sauce: blend smooth with garlic and parmesan as a lighter alfredo base.", "Meals — Lasagna filling: substitute for ricotta 1:1; most people can't tell.", "Meals — Quesadillas or wraps: spread inside with spinach and salsa.", "Baking — Flourless pancakes: cottage cheese + eggs + oats + a banana, blended. High protein, no flour.", "Baking — Cheesecake or muffins: blend smooth, swap for cream cheese or ricotta."], "tips": "Don't love the texture? Blend it smooth — it becomes like thick Greek yogurt and works in almost anything. Freezes OK in cooked dishes (lasagna, baked goods) but not on its own. Pairs well with hot sauce for a zero-prep savory protein hit.", "complete": true}, {"id": "r_berry_toast", "category": "Breakfast & Snacks", "title": "Berry Toast", "subtitle": "", "tags": ["VEGETARIAN"], "baseYield": 1, "yieldUnit": "serving", "notes": "A quick breakfast or snack: toasted bread, a creamy base, a layer of berry jelly, then fresh berries on top. Ricotta is the go-to base here — lighter and slightly sweet — with cream cheese or labneh as easy backups. Active: ~5 min", "ingredients": [{"name": "Bread (whole grain, sourdough, or your favorite)", "amount": 1, "unit": "slice", "note": "", "section": null}, {"name": "Ricotta cheese", "amount": 30, "unit": "g", "note": "or cream cheese, or labneh; 2 tbsp", "section": null}, {"name": "Strawberry or mixed berry jelly", "amount": 10, "unit": "g", "note": "2 tsp", "section": null}, {"name": "Mixed berries", "amount": 35, "unit": "g", "note": "1/4 cup", "section": null}, {"name": "Honey", "amount": 7, "unit": "g", "note": "optional, 1 tsp", "section": null}], "steps": ["Toast the bread to your desired crispiness.", "Spread the ricotta evenly over the toast.", "Spread a thin layer of berry jelly over the ricotta.", "Arrange the mixed berries on top, slicing larger ones like strawberries for better coverage.", "Drizzle with honey if using. Serve immediately."], "tips": "Base options: ricotta (light, slightly sweet, the default here), cream cheese (richer, more tang — good backup), or labneh (thicker and tangier, also a good backup — see the Labneh recipe in this book). Other swaps if you want to experiment further: Greek yogurt, mascarpone, blended cottage cheese, nut butters, coconut yogurt, or mashed avocado all work as a base in a pinch.", "complete": true}, {"id": "r_ny_strip", "category": "Meal Prep", "title": "NY Strip Meal Prep Cubes", "subtitle": "With air fryer sweet potatoes", "tags": ["HIGH PROTEIN", "MEAL-PREP FRIENDLY", "GLUTEN-FREE"], "baseYield": 1.5, "yieldUnit": "kg beef (≈4-5 containers)", "notes": "For breaking down a large NY strip loin: cube the portion you're eating this week (better for microwave reheating), keep the rest as whole steaks for the freezer. Seared in a cast iron pan, slightly underdone on purpose since it finishes cooking on reheat. Active: ~30 min", "ingredients": [{"name": "NY strip loin, trimmed, cubed 1-1.25\"", "amount": 1500, "unit": "g", "note": "~3 lb", "section": "Beef (meal-prep portion)"}, {"name": "Fine sea salt", "amount": 12, "unit": "g", "note": "2 tsp", "section": "Beef (meal-prep portion)"}, {"name": "Black pepper, cracked", "amount": 3, "unit": "g", "note": "1 tsp", "section": "Beef (meal-prep portion)"}, {"name": "Avocado oil", "amount": 22, "unit": "g", "note": "1-2 tbsp, for searing", "section": "Beef (meal-prep portion)"}, {"name": " eave the skin on for air frying — it crisps up, adds fiber, and saves prep time. Just scrub well first; only peel if you personally dislike the texture. Doneness logic: pulling the beef underdone (125-135°F) is intentional — microwave reheating continues cooking it, so searing to full medium now means overdone, dry meat by the time you eat it later in the week.", "complete": true}, {"id": "r_ground_beef", "category": "Meal Prep", "title": "Ground Beef Meal Prep", "subtitle": "Rice or sweet potato", "tags": ["HIGH PROTEIN", "MEAL-PREP FRIENDLY"], "baseYield": 5, "yieldUnit": "servings", "notes": "A straightforward seasoned ground beef base you can pair with either dry white rice or roasted sweet potatoes, depending on what you're in the mood for. Both starch options are sized to match the beef for about 5 servings. Active: ~25-30 min", "ingredients": [{"name": "Ground beef (80/20 or leaner)", "amount": 907, "unit": "g", "note": "2 lb", "section": "Ground beef"}, {"name": "Fine sea salt", "amount": 8, "unit": "g", "note": "1.5 tsp", "section": "Ground beef"}, {"name": "Black pepper, cracked", "amount": 2, "unit": "g", "note": "0.75 tsp", "section": "Ground beef"}, {"name": "Garlic powder", "amount": 5, "unit": "g", "note": "1.5 tsp", "section": "Ground beef"}, {"name": "Onion powder", "amount": 5, "unit": "g", "note": "1.5 tsp", "section": "Ground beef"}, {"name": "Smoked paprika", "amount": 3, "unit": "g", "note": "optional, 1 tsp", "section": "Ground beef"}, {"name": "Dry white rice", "amount": 600, "unit": "g", "note": "", "section": "Option A: White rice"}, {"name": "Water", "amount": 930, "unit": "g", "note": "1.5-1.6× rice weight, 900-960 g", "section": "Option A: White rice"}, {"name": "Fine sea salt", "amount": 3, "unit": "g", "note": "0.5 tsp", "section": "Option A: White rice"}, {"name": "Sweet potatoes, skin on, scrubbed, cubed 3/4-1\"", "amount": 1000, "unit": "g", "note": "", "section": "Option B: Sweet potatoes"}, {"name": "Avocado or olive oil", "amount
