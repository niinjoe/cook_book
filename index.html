/* ===================== State ===================== */
let recipes = [];
let activeCategory = 'All';
let activeRecipeId = null;
let servingsOverride = {}; // id -> current yield qty

/* ===================== Init ===================== */
(async function init(){
  await openDB();
  let existing = await getAll();
  if(existing.length === 0){
    for(const r of SEED){ await putRecipe(r); }
    existing = await getAll();
  }
  recipes = existing;
  renderTabs();
  renderMain();
})();

/* ===================== Rendering ===================== */
function categoriesPresent(){
  const set = new Set(recipes.map(r=>r.category));
  const ordered = CATEGORY_ORDER.filter(c=>set.has(c));
  const extra = [...set].filter(c=>!CATEGORY_ORDER.includes(c));
  return ordered.concat(extra);
}

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  const cats = categoriesPresent();
  const counts = {};
  recipes.forEach(r=> counts[r.category] = (counts[r.category]||0)+1);
  let html = `<div class="tab ${activeCategory==='All'?'active':''}" data-cat="All">All recipes <span class="tab-count">${recipes.length}</span></div>`;
  cats.forEach(c=>{
    html += `<div class="tab ${activeCategory===c?'active':''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)} <span class="tab-count">${counts[c]}</span></div>`;
  });
  tabsEl.innerHTML = html;
  tabsEl.querySelectorAll('.tab').forEach(el=>{
    el.addEventListener('click', ()=>{
      activeCategory = el.dataset.cat;
      activeRecipeId = null;
      renderTabs();
      renderMain();
    });
  });
}

function renderMain(){
  const main = document.getElementById('main');
  if(activeRecipeId){
    renderDetail(main);
    return;
  }
  const list = recipes
    .filter(r=> activeCategory==='All' || r.category===activeCategory)
    .sort((a,b)=> a.title.localeCompare(b.title));

  let html = `
    <div class="topline">
      <div>
        <h1 class="h1">${activeCategory==='All' ? 'All Recipes' : escapeHtml(activeCategory)}</h1>
        <p class="h1-sub">${list.length} recipe${list.length!==1?'s':''} · gram measurements throughout</p>
      </div>
      <button class="add-recipe-btn" id="addBtn">+ Add recipe</button>
    </div>
  `;

  if(list.length === 0){
    html += `<div class="empty">Nothing here yet. Add the first recipe in this category.</div>`;
  } else {
    html += `<div class="grid">`;
    list.forEach(r=>{
      html += `
        <div class="card" data-id="${r.id}">
          <div class="card-cat">${escapeHtml(r.category)}</div>
          <div class="card-title">${escapeHtml(r.title)}</div>
          <div class="card-meta">${escapeHtml(r.subtitle||'')}</div>
          ${!r.complete ? '<span class="chip-stub">needs details</span>' : ''}
        </div>`;
    });
    html += `</div>`;
  }
  main.innerHTML = html;

  document.getElementById('addBtn').addEventListener('click', ()=> openForm(null));
  main.querySelectorAll('.card').forEach(el=>{
    el.addEventListener('click', ()=>{
      activeRecipeId = el.dataset.id;
      renderMain();
    });
  });
}

function scaleAmount(amount, unit, factor){
  if(amount === undefined || amount === null) return null;
  const val = amount * factor;
  if(unit === 'g' || unit === 'ml'){
    return val < 10 ? Math.round(val*10)/10 : Math.round(val);
  }
  if(unit === 'tsp' || unit === 'tbsp'){
    return Math.round(val*4)/4;
  }
  // countable items (eggs, cloves, kiwi, slices, cups, pinches, etc.)
  return val < 1 ? Math.round(val*10)/10 : Math.round(val);
}
function formatAmountUnit(amount, unit){
  if(amount === null) return '';
  const n = formatNum(amount);
  if(!unit) return n;
  return `${n} ${unit}`;
}

function renderDetail(main){
  const r = recipes.find(x=>x.id===activeRecipeId);
  if(!r){ activeRecipeId=null; renderMain(); return; }
  const currentYield = servingsOverride[r.id] ?? r.baseYield;
  const factor = (r.baseYield && r.baseYield > 0) ? (currentYield / r.baseYield) : 1;

  let html = `
    <div class="detail">
      <button class="back-btn" id="backBtn">&larr; Back to ${escapeHtml(activeCategory==='All'?'all recipes':activeCategory)}</button>
      <div class="detail-card">
        <div class="detail-cat">${escapeHtml(r.category)}</div>
        <h2 class="detail-title">${escapeHtml(r.title)}</h2>
        ${(r.tags && r.tags.length) ? `<div style="margin:-2px 0 12px;">${r.tags.map(t=>`<span class="chip-stub" style="background:#EDEAD9;color:var(--moss);margin-right:6px;">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
        ${r.notes ? `<p class="detail-notes">${escapeHtml(r.notes)}</p>` : ''}
        <div class="detail-row-actions">
          <button class="icon-btn" id="editBtn">Edit</button>
          <button class="icon-btn danger" id="deleteBtn">Delete</button>
        </div>
  `;

  if(r.baseYield && r.baseYield > 0){
    html += `
      <div class="yield-box">
        <span class="lbl">Yield</span>
        <div class="stepper">
          <button id="decBtn">&minus;</button>
          <span id="yieldVal">${formatNum(currentYield)} ${escapeHtml(r.yieldUnit||'')}</span>
          <button id="incBtn">+</button>
        </div>
      </div>`;
  }

  if(r.ingredients && r.ingredients.length){
    html += `<h3 class="section-h">Ingredients</h3>`;
    const sections = [];
    const seen = new Set();
    r.ingredients.forEach(ing=>{
      const key = ing.section || '__none__';
      if(!seen.has(key)){ seen.add(key); sections.push(key); }
    });
    sections.forEach(sec=>{
      if(sec !== '__none__'){
        html += `<div class="sub-h">${escapeHtml(sec)}</div>`;
      }
      html += `<ul class="ingredient-list">`;
      r.ingredients.filter(i=>(i.section||'__none__')===sec).forEach(ing=>{
        const scaled = scaleAmount(ing.amount, ing.unit, factor);
        const amtStr = formatAmountUnit(scaled, ing.unit);
        html += `<li>
          <span>${escapeHtml(ing.name)}${ing.note ? `<span class="ing-note">${escapeHtml(ing.note)}</span>`:''}</span>
          <span class="ing-amt">${escapeHtml(amtStr)}</span>
        </li>`;
      });
      html += `</ul>`;
    });
  } else {
    html += `<h3 class="section-h">Ingredients</h3><p class="detail-notes">Not filled in yet — hit Edit to add amounts.</p>`;
  }

  if(r.steps && r.steps.length){
    html += `<h3 class="section-h">Method</h3><ol class="steps-list">`;
    r.steps.forEach(s=> html += `<li>${escapeHtml(s)}</li>`);
    html += `</ol>`;
  } else {
    html += `<h3 class="section-h">Method</h3><p class="detail-notes">No steps yet — hit Edit to add the method.</p>`;
  }

  if(r.tips){
    html += `<h3 class="section-h">Notes</h3><p class="detail-notes">${escapeHtml(r.tips)}</p>`;
  }

  html += `</div></div>`;
  main.innerHTML = html;

  document.getElementById('backBtn').addEventListener('click', ()=>{ activeRecipeId=null; renderMain(); });
  document.getElementById('editBtn').addEventListener('click', ()=> openForm(r));
  document.getElementById('deleteBtn').addEventListener('click', async ()=>{
    if(confirm(`Delete "${r.title}"? This can't be undone.`)){
      await deleteRecipe(r.id);
      recipes = recipes.filter(x=>x.id!==r.id);
      activeRecipeId = null;
      renderTabs(); renderMain();
      showToast('Recipe deleted');
    }
  });
  const decBtn = document.getElementById('decBtn');
  const incBtn = document.getElementById('incBtn');
  if(decBtn){
    decBtn.addEventListener('click', ()=>{
      const step = r.baseYield >= 100 ? Math.max(1, Math.round(r.baseYield*0.1)) : 1;
      servingsOverride[r.id] = Math.max(step, (servingsOverride[r.id] ?? r.baseYield) - step);
      renderDetail(main);
    });
    incBtn.addEventListener('click', ()=>{
      const step = r.baseYield >= 100 ? Math.max(1, Math.round(r.baseYield*0.1)) : 1;
      servingsOverride[r.id] = (servingsOverride[r.id] ?? r.baseYield) + step;
      renderDetail(main);
    });
  }
}

function formatNum(n){
  if(Number.isInteger(n)) return n.toString();
  return n.toFixed(1);
}

/* ===================== Add / Edit form ===================== */
function openForm(recipe){
  const isEdit = !!recipe;
  const r = recipe || { id: uid(), category: activeCategory!=='All'?activeCategory:'Pizza', title:'', subtitle:'', notes:'', baseYield:1, yieldUnit:'servings', ingredients:[], steps:[], complete:true };

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h2>${isEdit ? 'Edit recipe' : 'Add a recipe'}</h2>
      <div class="field"><label>Title</label><input type="text" id="f_title" value="${escapeAttr(r.title)}"></div>
      <div class="two-col">
        <div class="field">
          <label>Category</label>
          <select id="f_category">
            ${CATEGORY_ORDER.map(c=>`<option value="${c}" ${r.category===c?'selected':''}>${c}</option>`).join('')}
            <option value="__new__">+ New category…</option>
          </select>
        </div>
        <div class="field"><label>Subtitle</label><input type="text" id="f_subtitle" value="${escapeAttr(r.subtitle||'')}"></div>
      </div>
      <div class="field" id="newCatField" style="display:none;"><label>New category name</label><input type="text" id="f_newcat"></div>
      <div class="two-col">
        <div class="field"><label>Base yield (number)</label><input type="number" step="0.1" id="f_yield" value="${r.baseYield}"></div>
        <div class="field"><label>Yield unit</label><input type="text" id="f_yieldunit" value="${escapeAttr(r.yieldUnit||'')}" placeholder="dough balls, servings, cake…"></div>
      </div>
      <div class="field"><label>Notes</label><textarea id="f_notes">${escapeHtml(r.notes||'')}</textarea></div>
      <div class="field"><label>Tags (comma-separated, optional)</label><input type="text" id="f_tags" value="${escapeAttr((r.tags||[]).join(', '))}" placeholder="VEGETARIAN, MAKE-AHEAD…"></div>

      <div class="field">
        <label>Ingredients (amount + unit — leave amount blank for to-taste items)</label>
        <div id="ingRows"></div>
        <button type="button" class="add-row-btn" id="addIngRow">+ Add ingredient</button>
      </div>

      <div class="field">
        <label>Method steps</label>
        <div id="stepRows"></div>
        <button type="button" class="add-row-btn" id="addStepRow">+ Add step</button>
      </div>

      <div class="field"><label>Extra tips / notes (shown at the bottom)</label><textarea id="f_tips">${escapeHtml(r.tips||'')}</textarea></div>

      <div class="modal-actions">
        <button class="cancel-btn" id="cancelBtn">Cancel</button>
        <button class="primary-btn" id="saveBtn">Save recipe</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const ingRows = overlay.querySelector('#ingRows');
  const stepRows = overlay.querySelector('#stepRows');

  function addIngRow(ing){
    const row = document.createElement('div');
    row.className = 'ing-row';
    row.innerHTML = `
      <input type="text" placeholder="Section (optional, e.g. Crust)" class="ing-section" value="${escapeAttr(ing?.section||'')}" style="flex:1;">
      <input type="text" placeholder="Ingredient name" class="ing-name" value="${escapeAttr(ing?.name||'')}" style="flex:1.6;">
      <input type="number" step="0.1" placeholder="amount" class="ing-amount" value="${ing?.amount ?? ''}" style="flex:0.7;">
      <input type="text" placeholder="unit (g, ml, tsp…)" class="ing-unit" value="${escapeAttr(ing?.unit||'')}" style="flex:0.8;">
      <input type="text" placeholder="note (optional)" class="ing-note" value="${escapeAttr(ing?.note||'')}" style="flex:1.2;">
      <button type="button" class="row-remove" title="Remove">&times;</button>
    `;
    row.querySelector('.row-remove').addEventListener('click', ()=> row.remove());
    ingRows.appendChild(row);
  }
  function addStepRow(step){
    const row = document.createElement('div');
    row.className = 'step-row';
    row.innerHTML = `
      <textarea placeholder="Describe this step" style="flex:1; min-height:38px;">${escapeHtml(step||'')}</textarea>
      <button type="button" class="row-remove" title="Remove">&times;</button>
    `;
    row.querySelector('.row-remove').addEventListener('click', ()=> row.remove());
    stepRows.appendChild(row);
  }

  (r.ingredients||[]).forEach(addIngRow);
  if((r.ingredients||[]).length===0) addIngRow();
  (r.steps||[]).forEach(addStepRow);
  if((r.steps||[]).length===0) addStepRow();

  overlay.querySelector('#addIngRow').addEventListener('click', ()=> addIngRow());
  overlay.querySelector('#addStepRow').addEventListener('click', ()=> addStepRow());

  const catSelect = overlay.querySelector('#f_category');
  const newCatField = overlay.querySelector('#newCatField');
  catSelect.addEventListener('change', ()=>{
    newCatField.style.display = catSelect.value === '__new__' ? 'block' : 'none';
  });

  overlay.querySelector('#cancelBtn').addEventListener('click', ()=> overlay.remove());
  overlay.addEventListener('mousedown', (e)=>{ if(e.target===overlay) overlay.remove(); });

  overlay.querySelector('#saveBtn').addEventListener('click', async ()=>{
    const title = overlay.querySelector('#f_title').value.trim();
    if(!title){ alert('Give the recipe a title first.'); return; }
    let category = catSelect.value;
    if(category === '__new__'){
      category = overlay.querySelector('#f_newcat').value.trim() || 'Uncategorized';
    }
    const ingredients = [...ingRows.querySelectorAll('.ing-row')].map(row=>{
      const name = row.querySelector('.ing-name').value.trim();
      const amountRaw = row.querySelector('.ing-amount').value;
      const unit = row.querySelector('.ing-unit').value.trim();
      const note = row.querySelector('.ing-note').value.trim();
      const section = row.querySelector('.ing-section').value.trim();
      return name ? { name, amount: amountRaw===''? null : parseFloat(amountRaw), unit, note, section: section || null } : null;
    }).filter(Boolean);
    const steps = [...stepRows.querySelectorAll('textarea')].map(t=>t.value.trim()).filter(Boolean);
    const tags = overlay.querySelector('#f_tags').value.split(',').map(t=>t.trim()).filter(Boolean);

    const updated = {
      id: r.id,
      category,
      title,
      subtitle: overlay.querySelector('#f_subtitle').value.trim(),
      notes: overlay.querySelector('#f_notes').value.trim(),
      tags,
      baseYield: parseFloat(overlay.querySelector('#f_yield').value) || null,
      yieldUnit: overlay.querySelector('#f_yieldunit').value.trim(),
      ingredients,
      steps,
      tips: overlay.querySelector('#f_tips').value.trim(),
      complete: (ingredients.length>0 || steps.length>0)
    };

    await putRecipe(updated);
    const idx = recipes.findIndex(x=>x.id===updated.id);
    if(idx>=0) recipes[idx] = updated; else recipes.push(updated);
    delete servingsOverride[updated.id];
    activeRecipeId = updated.id;
    activeCategory = updated.category;
    overlay.remove();
    renderTabs();
    renderMain();
    showToast(isEdit ? 'Recipe updated' : 'Recipe added');
  });
}

/* ===================== Export / Import ===================== */
document.getElementById('exportBtn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(recipes, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'recipe-box-backup.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('Backup downloaded');
});
document.getElementById('importBtn').addEventListener('click', ()=> document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const imported = JSON.parse(text);
    if(!Array.isArray(imported)) throw new Error('bad format');
    for(const rec of imported){
      if(!rec.id) rec.id = uid();
      await putRecipe(rec);
    }
    recipes = await getAll();
    renderTabs(); renderMain();
    showToast(`Imported ${imported.length} recipe(s)`);
  }catch(err){
    alert('Could not read that file — expecting a backup exported from this app.');
  }
  e.target.value = '';
});

/* ===================== Utilities ===================== */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function escapeAttr(str){ return escapeHtml(str); }
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
}

/* ===================== PWA registration ===================== */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* fine if this fails locally */ });
  });
}
